[package]
name = "arduino-uno-dht11-rs"
version = "0.1.0"
edition = "2024"
authors = ["Nabil ELQATIB <nabilelqatib@gmail.com>"]

[dependencies]
panic-halt = "1.0.0"
ufmt = "0.2.0"
embedded-hal = "1.0"
dht11 = "0.3.1"
avr-device = "0.7"

[dependencies.arduino-hal]
git = "https://github.com/rahix/avr-hal"
rev = "ravedude-0.2.0"
features = ["arduino-uno"]

[profile.dev]
panic = "abort"
lto = true
opt-level = "s"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
